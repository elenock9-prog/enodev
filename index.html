<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnoDev</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--card:#fff;--ink:#241B3A;--mute:#7A7190;--line:#EBDFCB;--acc:#C8325F;--acc-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#1B1536;--card:#261E45;--ink:#FBF1E0;--mute:#A69DC4;--line:#3A3160;--acc:#F2708F;--acc-ink:#1B1536}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:22px 16px 60px}
h1{font:700 2.4rem/1.05 Fraunces,Georgia,serif;margin:6px 0 4px}h2{font:700 1.35rem Fraunces,Georgia,serif;margin:0 0 4px}
.sub,.hint{color:var(--mute);margin:0 0 14px}.hint{font-size:.9rem;margin:8px 0 0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
textarea{min-height:130px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:11px 16px;font:600 1rem Figtree,sans-serif;cursor:pointer;margin-top:10px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.pick{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);cursor:pointer;margin-top:8px}.pick input{display:none}
.ph{display:flex;gap:10px;align-items:center;margin-top:10px}.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px}.ph input{margin:0;flex:1}
.x{background:none;border:0;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:6px}
.lt{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.lt p{margin:2px 0;color:var(--mute);max-height:3.2em;overflow:hidden;white-space:pre-wrap}
#lk{word-break:break-all;font-weight:600;margin-top:8px}
#pv{position:fixed;inset:0;background:#1B1536;color:#FBF1E0;z-index:9;display:none;overflow:auto;font:17px/1.6 Georgia,serif}
#pv .cl{position:fixed;top:8px;right:8px;z-index:3}
#c{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s}
#c h1{font:700 2.2rem/1.1 Georgia,serif;margin:10px 0}#c p{color:#C9BFE6;margin:0 0 22px}
#c button{background:#F5C26B;color:#241B3A;border:0;border-radius:99px;padding:14px 28px;font:700 1.05rem Georgia,serif;cursor:pointer}
.e{font-size:4rem}#g{display:none;max-width:560px;margin:0 auto;padding:40px 16px 80px}
#g.on{display:block;animation:f 1.2s}@keyframes f{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){#g.on{animation:none}}
#g h2{text-align:center;font:700 1.8rem Georgia,serif;margin:0 0 30px;color:#FBF1E0}
figure{background:#FFF8EE;color:#241B3A;margin:0 auto 34px;padding:10px 10px 14px;width:min(92%,380px);transform:rotate(var(--r));box-shadow:0 8px 24px #0006}
figure img{width:100%;display:block}figcaption{text-align:center;padding-top:8px;font-style:italic}
article{background:#FFF8EE;color:#241B3A;border-radius:6px;padding:22px;margin:0 0 28px}article h3{margin:0 0 10px;font-size:1.3rem}article p{margin:0;white-space:pre-wrap}
</style></head><body>
<main id="mk">
<h1>EnoDev</h1><p class="sub">Prépare une surprise d’anniversaire qu’elle n’oubliera jamais.</p>
<section><h2>1. Pour qui ?</h2>
<input id="nm" placeholder="Son prénom" aria-label="Son prénom">
<input id="ti" placeholder="Titre : Joyeux anniversaire, mon amour" aria-label="Titre">
<input id="dt" type="date" aria-label="Date de l’anniversaire"></section>
<section><h2>2. Vos souvenirs</h2><p class="hint" style="margin:0">Jusqu’à 10 photos, avec un mot pour chacune.</p>
<label class="pick">📷 Choisir des photos<input id="pf" type="file" accept="image/*" multiple></label><div id="phs"></div></section>
<section><h2>3. Tes lettres</h2>
<input id="lt" placeholder="Titre de la lettre" aria-label="Titre de la lettre">
<textarea id="lx" placeholder="Écris avec ton cœur…" aria-label="Texte de la lettre"></textarea>
<button class="btn alt" id="al">Ajouter la lettre</button><div id="lts"></div></section>
<section><h2>4. Envoie ta surprise</h2>
<input id="cd" placeholder="Ton code d’accès (ex. ENO-4K7Q2A)" aria-label="Code d’accès" autocapitalize="characters" autocomplete="off">
<button class="btn alt" id="pvb">Voir comme elle</button> <button class="btn" id="go">Créer le lien</button>
<p class="hint" id="msg"></p><div id="lk"></div><button class="btn alt" id="cp" style="display:none">Partager le lien</button></section>
</main>
<div id="pv"><button class="btn cl" id="pvx">Fermer</button><div id="pvc"></div></div>
<script>
var U="https://tpcsnsgorjywocpewtnl.supabase.co",K="sb_publishable_VBXYNuPyY3wDzcLtCpopBA_X_byMr5h";
var D={nm:"",ti:"",dt:"",ph:[],lt:[]},LINK="";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function giftHTML(d){var n=esc(d.nm||"toi"),t=esc(d.ti||("Joyeux anniversaire, "+(d.nm||"mon amour"))),dd="";
if(d.dt){try{dd=new Date(d.dt+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}catch(e){}}
var ph=d.ph.map(function(p,i){return'<figure style="--r:'+((i%2?1:-1)*(1+i%3))+'deg"><img src="'+esc(p.src)+'" alt=""><figcaption>'+esc(p.cap)+'</figcaption></figure>'}).join("");
var lt=d.lt.map(function(l){return'<article><h3>'+esc(l.t)+'</h3><p>'+esc(l.x)+'</p></article>'}).join("");
return'<div id="c"><div class="e">🎁</div><h1>'+t+'</h1><p>'+(dd?dd+" · ":"")+'Une surprise t’attend, '+n+'.</p><button id="op">Ouvrir mon cadeau</button></div><div id="g"><h2>Pour toi, '+n+' ♥</h2>'+ph+lt+'</div>'}
function show(d,close){var p=$("pv");$("pvc").innerHTML=giftHTML(d);p.style.display="block";p.scrollTop=0;$("pvx").style.display=close?"block":"none";
$("op").onclick=function(){var c=$("c");c.style.opacity=0;setTimeout(function(){c.style.display="none";$("g").className="on";p.scrollTop=0},700)}}
function rp(){$("phs").innerHTML=D.ph.map(function(p,i){return'<div class="ph"><img src="'+p.src+'" alt=""><input data-c="'+i+'" value="'+esc(p.cap)+'" placeholder="Un mot sur ce souvenir" aria-label="Légende"><button class="x" data-dp="'+i+'" aria-label="Retirer">×</button></div>'}).join("")}
function rl(){$("lts").innerHTML=D.lt.map(function(l,i){return'<div class="lt"><button class="x" style="float:right" data-dl="'+i+'" aria-label="Supprimer">×</button><b>'+esc(l.t)+'</b><p>'+esc(l.x)+'</p></div>'}).join("")}
function sv(){try{localStorage.setItem("enodev-3",JSON.stringify({nm:D.nm,ti:D.ti,dt:D.dt,lt:D.lt}))}catch(e){}}
["nm","ti","dt"].forEach(function(k){$(k).addEventListener("input",function(){D[k]=this.value;sv()})});
$("pf").addEventListener("change",function(){var fs=Array.prototype.slice.call(this.files);this.value="";fs.forEach(function(f){if(D.ph.length>=10)return;var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
c.toBlob(function(b){if(D.ph.length<10){D.ph.push({blob:b,src:URL.createObjectURL(b),cap:""});rp()}},"image/jpeg",.78);URL.revokeObjectURL(u)};im.src=u})});
$("phs").addEventListener("input",function(e){if(e.target.dataset.c!=null)D.ph[+e.target.dataset.c].cap=e.target.value});
$("al").onclick=function(){var t=$("lt").value.trim(),x=$("lx").value.trim();if(!x){$("lx").focus();return}D.lt.push({t:t||"Pour toi",x:x});$("lt").value="";$("lx").value="";sv();rl()};
document.addEventListener("click",function(e){var d=e.target.dataset;if(d.dp!=null){D.ph.splice(+d.dp,1);rp()}if(d.dl!=null){D.lt.splice(+d.dl,1);sv();rl()}});
$("pvb").onclick=function(){show(D,true)};$("pvx").onclick=function(){$("pv").style.display="none"};
$("go").onclick=async function(){var cd=$("cd").value.trim(),H={apikey:K,"Content-Type":"application/json"};
if(!cd){$("msg").textContent="Entre ton code d’accès.";$("cd").focus();return}
if(!D.ph.length&&!D.lt.length){$("msg").textContent="Ajoute au moins une photo ou une lettre.";return}
var b=this;b.disabled=true;$("msg").textContent="Vérification du code…";
try{var r0=await fetch(U+"/rest/v1/rpc/claim_code",{method:"POST",headers:H,body:JSON.stringify({p_code:cd})}),c=await r0.json();
if(!r0.ok)throw{user:/utilis/.test(c.message||"")?"Ce code a déjà servi.":"Code invalide."};
if(D.ph.length>c.max_photos)throw{user:"Ton code permet "+c.max_photos+" photos maximum. Retire-en quelques-unes."};
var id=c.id,ph=[];$("msg").textContent="Envoi en cours… ne ferme pas la page.";
for(var i=0;i<D.ph.length;i++){var r=await fetch(U+"/storage/v1/object/photos/"+id+"/"+i+".jpg",{method:"POST",headers:{apikey:K,"Content-Type":"image/jpeg"},body:D.ph[i].blob});if(!r.ok){var tx="";try{tx=(await r.text()).slice(0,140)}catch(z){}throw new Error("photo "+r.status+" "+tx)}ph.push({src:U+"/storage/v1/object/public/photos/"+id+"/"+i+".jpg",cap:D.ph[i].cap})}
var r2=await fetch(U+"/rest/v1/rpc/publish_surprise",{method:"POST",headers:H,body:JSON.stringify({p_id:id,p_name:D.nm,p_title:D.ti,p_date:D.dt||null,p_photos:ph,p_letters:D.lt})});
if(!r2.ok)throw new Error("base "+r2.status);
LINK=location.origin+location.pathname+"?s="+id;$("lk").textContent=LINK;$("cp").style.display="inline-block";$("msg").textContent="Ton lien est prêt ! Envoie-le-lui.";
}catch(e){$("msg").textContent=e.user||("Échec de l’envoi ("+e.message+"). Réessaie.")}b.disabled=false};
$("cp").onclick=async function(){try{if(navigator.share)await navigator.share({title:"Une surprise pour toi",url:LINK});else{await navigator.clipboard.writeText(LINK);$("msg").textContent="Lien copié !"}}catch(e){}};
var sid=new URLSearchParams(location.search).get("s");
if(sid){$("mk").style.display="none";$("pv").style.display="block";$("pvc").innerHTML='<div id="c"><p>Chargement…</p></div>';
fetch(U+"/rest/v1/rpc/get_surprise",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({p_id:sid})}).then(function(r){return r.json()}).then(function(d){if(Array.isArray(d))d=d[0];
if(!d||!d.id)throw 0;show({nm:d.name,ti:d.title,dt:d.event_date,ph:d.photos||[],lt:d.letters||[]},false)}).catch(function(){$("pvc").innerHTML='<div id="c"><div class="e">🔍</div><p>Cette surprise est introuvable.</p></div>'})}
else try{var r=JSON.parse(localStorage.getItem("enodev-3")||"null");if(r){D.nm=r.nm||"";D.ti=r.ti||"";D.dt=r.dt||"";D.lt=r.lt||[];$("nm").value=D.nm;$("ti").value=D.ti;$("dt").value=D.dt;rl()}}catch(e){}
</script></body></html>
